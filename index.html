<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Sistema de Produccion EYP</title>
    <style>
        :root {
            --charcoal: #2c3e50;
            --blanco: #ffffff;
            --verde-claro: #e8f5e9;
            --verde-texto: #2e7d32;
            --celeste-claro: #e3f2fd;
            --celeste-texto: #1565c0;
            --gris-fondo: #f8f9fa;
            --gris-borde: #dddddd;
            --rojo-claro: #ffebee;
            --rojo-texto: #c62828;
            --amarillo-claro: #fff9c4;
            --amarillo-texto: #fbc02d;
            --gris-oscuro: #34495e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: var(--blanco);
            color: var(--charcoal);
        }

        /* Notificaciones mejoradas - sin sombras */
        .notificacion {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
            max-width: 350px;
            border: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notificacion::before {
            content: "●";
            font-size: 16px;
            margin-right: 5px;
        }

        .notificacion.exito {
            background: var(--verde-texto);
            border-left: 4px solid #1b5e20;
        }

        .notificacion.error {
            background: var(--rojo-texto);
            border-left: 4px solid #b71c1c;
        }

        .notificacion.advertencia {
            background: var(--amarillo-texto);
            color: var(--charcoal);
            border-left: 4px solid #f57f17;
        }

        .notificacion.advertencia::before {
            color: var(--charcoal);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive para móviles */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .notificacion {
                max-width: 90%;
                right: 5%;
                font-size: 13px;
                padding: 10px 15px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                flex: 1 1 auto;
                padding: 10px 12px;
                font-size: 11px;
            }

            .grid-form {
                grid-template-columns: 1fr;
            }

            .table-container {
                overflow-x: auto;
            }

            .modal-content {
                width: 95%;
                padding: 15px;
            }

            .user-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .login-container {
                width: 90%;
                margin: 30px auto;
                padding: 20px;
            }

            .pagination {
                flex-wrap: wrap;
            }
        }

        /* Login */
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid var(--gris-borde);
            background: var(--gris-fondo);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            border-left: none;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--gris-borde);
            box-sizing: border-box;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: var(--charcoal);
            color: white;
            border: 1px solid var(--charcoal);
            cursor: pointer;
            font-weight: bold;
        }

        .login-footer {
            text-align: center;
            margin-top: 15px;
        }

        .login-footer a {
            color: var(--celeste-texto);
            text-decoration: none;
            cursor: pointer;
        }

        /* Header con usuario */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--gris-borde);
        }

        .user-info {
            font-size: 14px;
        }

        .user-info strong {
            color: var(--celeste-texto);
        }

        .logout-btn {
            padding: 8px 15px;
            background: var(--rojo-claro);
            color: var(--rojo-texto);
            border: 1px solid var(--rojo-texto);
            cursor: pointer;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gris-borde);
        }

        .tab-btn {
            padding: 12px 25px;
            cursor: pointer;
            background: var(--gris-fondo);
            border: 1px solid var(--gris-borde);
            border-bottom: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--charcoal);
        }

        .tab-btn.active {
            background: var(--charcoal);
            color: var(--blanco);
            border-color: var(--charcoal);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        h2 {
            text-align: left;
            color: var(--charcoal);
            text-transform: uppercase;
            font-weight: 300;
            letter-spacing: 1px;
            border-left: 5px solid var(--verde-texto);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .top-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            border: 1px solid var(--gris-borde);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            background: white;
        }

        .btn-add {
            background: var(--verde-claro);
            color: var(--verde-texto);
            border-color: var(--verde-texto);
        }

        .btn-group {
            background: var(--charcoal);
            color: var(--blanco);
            border-color: var(--charcoal);
        }

        .btn-export {
            background: var(--gris-fondo);
            color: var(--charcoal);
            border-color: var(--charcoal);
        }

        .btn-admin {
            background: var(--celeste-claro);
            color: var(--celeste-texto);
            border-color: var(--celeste-texto);
        }

        /* Buscadores compactos */
        .search-container {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: transparent;
            padding: 0;
        }

        .search-input {
            padding: 8px 12px;
            border: 1px solid var(--gris-borde);
            font-size: 13px;
            min-width: 200px;
            flex: 1 1 auto;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-item label {
            font-size: 11px;
            font-weight: bold;
            color: var(--charcoal);
            white-space: nowrap;
        }

        .filter-item input {
            padding: 8px;
            border: 1px solid var(--gris-borde);
            font-size: 12px;
            width: 130px;
        }

        /* Tablas - sin bordes */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: white;
            margin-top: 10px;
            border: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
            border: none;
        }

        th {
            background: var(--charcoal);
            color: white;
            padding: 12px 10px;
            font-size: 10px;
            text-align: left;
            white-space: nowrap;
            font-weight: normal;
        }

        td {
            padding: 10px;
            font-size: 12px;
            white-space: nowrap;
            border: none;
        }

        tr {
            border: none;
        }

        tr:hover {
            background-color: var(--celeste-claro);
        }

        /* Paginación */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 10px 0;
        }

        .pagination button {
            padding: 6px 12px;
            font-size: 11px;
            min-width: 35px;
        }

        .pagination button.active {
            background: var(--charcoal);
            color: white;
            border-color: var(--charcoal);
        }

        .pagination-info {
            font-size: 12px;
            color: var(--gris-oscuro);
            margin-right: 15px;
        }

        .btn-action {
            width: 65px;
            padding: 5px 0;
            text-align: center;
            margin: 2px;
            display: inline-block;
        }

        /* Formulario */
        .form-container {
            display: none;
            background: var(--gris-fondo);
            padding: 20px;
            border: 1px solid var(--gris-borde);
            margin-bottom: 20px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            font-size: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            color: var(--charcoal);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--gris-borde);
            box-sizing: border-box;
            font-size: 12px;
        }

        .form-group input.autocompletado {
            border-left: 4px solid var(--verde-texto);
            background-color: var(--verde-claro);
        }

        /* Sugerencias */
        .sugerencias {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--gris-borde);
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .sugerencias div {
            padding: 8px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 1px solid var(--gris-borde);
        }

        .sugerencias div:hover {
            background: var(--celeste-claro);
        }

        /* Card de Grupo Histórico */
        .group-card {
            border: 1px solid var(--gris-borde);
            margin-bottom: 15px;
            padding: 15px;
            background: white;
        }

        .group-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid var(--gris-borde);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        @media (min-width: 769px) {
            .group-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .group-code {
            font-weight: bold;
            color: var(--celeste-texto);
            font-size: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--gris-borde);
        }

        .modal-lg {
            max-width: 1400px;
            width: 95%;
        }

        /* Estilos para edición de registros */
        .edit-registros-container {
            max-height: 400px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid var(--gris-borde);
            background: white;
        }

        .edit-registros-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 1200px;
            border: none;
        }

        .edit-registros-tabla th {
            background: var(--charcoal);
            color: white;
            padding: 10px 5px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }

        .edit-registros-tabla td {
            padding: 8px 5px;
            border: none;
        }

        .edit-registros-tabla input {
            width: 100%;
            padding: 6px;
            border: 1px solid var(--gris-borde);
            box-sizing: border-box;
            font-size: 11px;
        }

        .btn-eliminar-registro {
            background: var(--rojo-claro);
            color: var(--rojo-texto);
            border: 1px solid var(--rojo-texto);
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .btn-agregar-registro {
            background: var(--verde-claro);
            color: var(--verde-texto);
            border: 1px solid var(--verde-texto);
            padding: 10px 15px;
            margin-top: 10px;
            width: 100%;
            font-size: 12px;
            cursor: pointer;
        }

        /* Tabla de detalles */
        .detalle-tabla-container {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid var(--gris-borde);
        }

        .detalle-tabla-container th {
            position: sticky;
            top: 0;
            background: var(--charcoal);
            color: white;
            z-index: 10;
        }

        /* Tabla de usuarios */
        .usuarios-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
            border: none;
        }

        .usuarios-table th {
            background: var(--charcoal);
            color: white;
            padding: 10px;
            text-align: left;
        }

        .usuarios-table td {
            padding: 8px 10px;
            border: none;
        }

        .permiso-badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            margin: 2px;
        }

        .permiso-activo {
            background: var(--verde-claro);
            color: var(--verde-texto);
            border: 1px solid var(--verde-texto);
        }

        .permiso-inactivo {
            background: var(--gris-fondo);
            color: var(--gris-oscuro);
            border: 1px solid var(--gris-borde);
        }

        /* Admin DB Tables */
        .admin-db-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border: none;
        }

        .admin-db-table th {
            background: var(--charcoal);
            color: white;
            padding: 8px;
            text-align: left;
        }

        .admin-db-table td {
            padding: 8px;
            border: none;
        }

        .admin-db-table input {
            width: 100%;
            padding: 6px;
            border: 1px solid var(--gris-borde);
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <div id="notificacionContainer"></div>
    <div id="app"></div>

    <script src="database.js"></script>

    <script>
        // Estado de la aplicación
        let datosDiarios = JSON.parse(localStorage.getItem("eyp_diario")) || [];
        let historialGrupos = JSON.parse(localStorage.getItem("eyp_historial")) || [];
        let contadorGrupo = parseInt(localStorage.getItem("eyp_contador")) || 1;

        // Variables para paginación
        let paginaActualDiario = 1;
        let filasPorPagina = 10;
        let paginaActualHistorial = 1;
        let gruposPorPagina = 5;

        // Variables para autocompletado
        let timeoutId;
        let currentEditMode = false;

        // Función para mostrar notificaciones mejoradas
        window.mostrarNotificacion = function (mensaje, tipo = 'exito') {
            const container = document.getElementById('notificacionContainer');
            const notificacion = document.createElement('div');
            notificacion.className = `notificacion ${tipo}`;

            // Agregar ícono según tipo
            const icono = tipo === 'exito' ? '✓' : tipo === 'error' ? '✗' : '⚠';
            notificacion.innerHTML = `<span style="font-weight:bold; margin-right:8px;">${icono}</span>${mensaje}`;

            container.appendChild(notificacion);

            setTimeout(() => {
                notificacion.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => {
                    if (container.contains(notificacion)) {
                        container.removeChild(notificacion);
                    }
                }, 300);
            }, 3000);
        };

        // Función para confirmar acciones
        function confirmarAccion(mensaje, callback) {
            if (confirm(mensaje)) {
                callback();
                return true;
            }
            return false;
        }

        // Comandos de teclado
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'g') {
                e.preventDefault();
                if (currentEditMode) {
                    guardarEdicionRegistros();
                } else {
                    guardar();
                }
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                if (currentEditMode) {
                    agregarRegistroVacio();
                } else {
                    abrirFormulario();
                }
            }
        });

        // Renderizar la aplicación según el estado de sesión
        function renderizarApp() {
            const app = document.getElementById('app');

            if (!db.haySesion()) {
                mostrarLogin();
            } else {
                mostrarSistema();
            }
        }

        // Mostrar pantalla de login
        function mostrarLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="login-container">
                    <h2>Sistema de Producción EYP</h2>
                    <input type="text" id="login-username" placeholder="Usuario">
                    <input type="password" id="login-password" placeholder="Contraseña">
                    <button onclick="iniciarSesion()">Ingresar</button>
                    <div class="login-footer">
                        <a onclick="mostrarRecuperarPassword()">¿Olvidó su contraseña?</a>
                    </div>
                </div>
            `;
        }

        // Iniciar sesión
        window.iniciarSesion = function () {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const resultado = db.login(username, password);

            if (resultado.success) {
                mostrarNotificacion('Bienvenido ' + resultado.usuario.nombre, 'exito');
                renderizarApp();
            } else {
                mostrarNotificacion(resultado.message, 'error');
            }
        };

        // Mostrar formulario de recuperación de contraseña
        window.mostrarRecuperarPassword = function () {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';

            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Recuperar Contraseña</h3>
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="rec-username" style="width:100%; padding:8px; border:1px solid var(--gris-borde);">
                    </div>
                    <div class="form-group" style="margin-top:10px;">
                        <label>Respuesta de seguridad</label>
                        <input type="text" id="rec-respuesta" style="width:100%; padding:8px; border:1px solid var(--gris-borde);">
                    </div>
                    <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
                        <button onclick="recuperarPassword()" style="padding:10px; background:var(--celeste-texto); color:white; border:1px solid var(--celeste-texto); cursor:pointer;">Recuperar</button>
                        <button onclick="this.closest('.modal').remove()" style="padding:10px; background:var(--gris-fondo); border:1px solid var(--gris-borde); cursor:pointer;">Cancelar</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        };

        // Recuperar contraseña
        window.recuperarPassword = function () {
            const username = document.getElementById('rec-username').value;
            const respuesta = document.getElementById('rec-respuesta').value;

            const resultado = db.recuperarPassword(username, respuesta);

            if (resultado.success) {
                alert('Respuesta correcta. Contacte al administrador para restablecer su contraseña.');
                document.querySelector('.modal').remove();
            } else {
                mostrarNotificacion(resultado.message, 'error');
            }
        };

        // Cerrar sesión
        window.cerrarSesion = function () {
            confirmarAccion('¿Cerrar sesión?', () => {
                db.cerrarSesion();
                renderizarApp();
            });
        };

        // Cambiar contraseña
        window.mostrarCambiarPassword = function (esAdmin = false) {
            const usuario = db.getUsuarioActual();

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';

            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Cambiar Contraseña</h3>
                    ${!esAdmin ? `
                    <div class="form-group">
                        <label>Contraseña actual</label>
                        <input type="password" id="cambiar-password-actual" style="width:100%; padding:8px; border:1px solid var(--gris-borde);">
                    </div>
                    ` : ''}
                    <div class="form-group" style="margin-top:10px;">
                        <label>Nueva contraseña</label>
                        <input type="password" id="cambiar-password-nueva" style="width:100%; padding:8px; border:1px solid var(--gris-borde);">
                    </div>
                    <div class="form-group" style="margin-top:10px;">
                        <label>Confirmar nueva contraseña</label>
                        <input type="password" id="cambiar-password-confirmar" style="width:100%; padding:8px; border:1px solid var(--gris-borde);">
                    </div>
                    <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
                        <button onclick="cambiarPassword(${esAdmin})" style="padding:10px; background:var(--verde-texto); color:white; border:1px solid var(--verde-texto); cursor:pointer;">Cambiar</button>
                        <button onclick="this.closest('.modal').remove()" style="padding:10px; background:var(--gris-fondo); border:1px solid var(--gris-borde); cursor:pointer;">Cancelar</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        };

        window.cambiarPassword = function (esAdmin = false) {
            const usuario = db.getUsuarioActual();
            const actual = esAdmin ? '' : document.getElementById('cambiar-password-actual').value;
            const nueva = document.getElementById('cambiar-password-nueva').value;
            const confirmar = document.getElementById('cambiar-password-confirmar').value;

            if (nueva !== confirmar) {
                mostrarNotificacion('Las contraseñas nuevas no coinciden', 'error');
                return;
            }

            const resultado = db.cambiarPassword(usuario.username, actual, nueva, esAdmin);

            if (resultado.success) {
                mostrarNotificacion(resultado.message, 'exito');
                document.querySelector('.modal').remove();
            } else {
                mostrarNotificacion(resultado.message, 'error');
            }
        };

        // Mostrar sistema principal
        function mostrarSistema() {
            const usuario = db.getUsuarioActual();
            const esAdmin = db.esAdministrador();
            const puedeCambiarPassword = db.tienePermiso('cambiarPassword') || esAdmin;

            const app = document.getElementById('app');
            app.innerHTML = `

        // Funciones de paginación
        function renderizarPaginacion(totalItems, itemsPorPagina, paginaActual, elementoId, callback) {
            const totalPaginas = Math.ceil(totalItems / itemsPorPagina);
            const contenedor = document.getElementById(elementoId);
            if (!contenedor) return;

            if (totalPaginas <= 1) {
                contenedor.innerHTML = '';
                return;
            }

            let html = `
                <span class="pagination-info">
                    Página ${paginaActual} de ${totalPaginas} (${totalItems} registros)
                </span>
            `;

            // Botón anterior
            html += `<button onclick="cambiarPagina('${elementoId}', ${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>‹</button>`;

            // Números de página
            let inicio = Math.max(1, paginaActual - 2);
            let fin = Math.min(totalPaginas, paginaActual + 2);

            for (let i = inicio; i <= fin; i++) {
                html += `<button onclick="cambiarPagina('${elementoId}', ${i})" class="${i === paginaActual ? 'active' : ''}">${i}</button>`;
            }

            // Botón siguiente
            html += `<button onclick="cambiarPagina('${elementoId}', ${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled' : ''}>›</button>`;

            contenedor.innerHTML = html;
        }

        window.cambiarPagina = function (elementoId, nuevaPagina) {
            if (elementoId === 'paginacionDiario') {
                paginaActualDiario = nuevaPagina;

            } else if (elementoId === 'paginacionHistorial') {
                paginaActualHistorial = nuevaPagina;
                renderizarHistorial();
            }
        };

        // Configurar eventos de autocompletado
        function configurarAutocompletado() {
            const inputCodigo = document.getElementById('codigo');
            const inputCodActividad = document.getElementById('codActividad');

            if (inputCodigo) {
                inputCodigo.addEventListener('input', function () {
                    clearTimeout(timeoutId);
                    const valor = this.value;
                    timeoutId = setTimeout(() => {
                        const trabajador = db.buscarTrabajador(valor);
                        if (trabajador) {
                            document.getElementById('nombre').value = trabajador.nombre;
                            document.getElementById('nombre').classList.add('autocompletado');
                            ocultarSugerencias('trabajador');
                        } else {
                            document.getElementById('nombre').value = '';
                            document.getElementById('nombre').classList.remove('autocompletado');
                            mostrarSugerenciasTrabajador(valor);
                        }
                    }, 300);
                });
            }

            if (inputCodActividad) {
                inputCodActividad.addEventListener('input', function () {
                    clearTimeout(timeoutId);
                    const valor = this.value;
                    timeoutId = setTimeout(() => {
                        const actividad = db.buscarActividad(valor);
                        if (actividad) {
                            document.getElementById('actividad').value = actividad.nombre;
                            document.getElementById('actividad').classList.add('autocompletado');
                            ocultarSugerencias('actividad');
                        } else {
                            document.getElementById('actividad').value = '';
                            document.getElementById('actividad').classList.remove('autocompletado');
                            mostrarSugerenciasActividad(valor);
                        }
                    }, 300);
                });
            }
        }

        function mostrarSugerenciasTrabajador(termino) {
            const sugerencias = document.getElementById('sugerencias-trabajador');

            if (filtrados.length === 0) {
                sugerencias.style.display = 'none';
                return;

            sugerencias.innerHTML = '';
            filtrados.forEach(t => {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${t.codigo}</strong> - ${t.nombre}`;
                div.onclick = () => {
                    document.getElementById('codigo').value = t.codigo;
                    document.getElementById('nombre').value = t.nombre;
                    document.getElementById('nombre').classList.add('autocompletado');
                    sugerencias.style.display = 'none';
                };
                sugerencias.appendChild(div);
            });

            sugerencias.style.display = 'block';
        }

        function guardar() {
            const ids = ['codigo', 'nombre', 'codActividad', 'actividad', 'produccion', 'lote', 'hectareas', 'anio', 'dia', 'avance', 'hEntrada', 'hSalida', 'hOrdinarias', 'hExtras'];
            let reg = {};
            ids.forEach(id => reg[id] = document.getElementById(id).value);

            if (!reg.nombre) {
                mostrarNotificacion("El campo NOMBRE es obligatorio", 'error');
                return;
            }

            if (!reg.actividad) {
                mostrarNotificacion("El campo ACTIVIDAD es obligatorio", 'error');
                return;
            }

            let idx = document.getElementById("editIndex").value;
            if (idx === "") {
                datosDiarios.push(reg);
                mostrarNotificacion("Registro agregado exitosamente", 'exito');
            } else {
                if (!db.tienePermiso('editarRegistros')) {
                    mostrarNotificacion('No tiene permiso para editar registros', 'error');
                    return;
                }
                datosDiarios[idx] = reg;
                mostrarNotificacion("Registro actualizado exitosamente", 'exito');
            }

            localStorage.setItem("eyp_diario", JSON.stringify(datosDiarios));
            limpiar();
            paginaActualDiario = 1;
            renderizarDiario();
        }

        function renderizarDiario() {
            let tbody = document.getElementById("tablaCuerpo");
            if (!tbody) return;

            const filtro = document.getElementById('buscarDiario')?.value.toLowerCase() || '';

            let datosFiltrados = datosDiarios.filter(d =>
                d.codigo?.toLowerCase().includes(filtro) ||
                d.nombre?.toLowerCase().includes(filtro) ||
                d.actividad?.toLowerCase().includes(filtro)
            );

            // Aplicar paginación
            const inicio = (paginaActualDiario - 1) * filasPorPagina;
            const fin = inicio + filasPorPagina;
            const datosPaginados = datosFiltrados.slice(inicio, fin);

            tbody.innerHTML = "";
            datosPaginados.forEach((d, i) => {
                const indexOriginal = datosDiarios.indexOf(d);
                let acciones = '';
                if (db.tienePermiso('editarRegistros')) {
                    acciones += `<button class="btn-action btn-edit" onclick="editar(${indexOriginal})">Editar</button> `;
                }
                if (db.tienePermiso('eliminarRegistros')) {
                    acciones += `<button class="btn-action btn-delete" onclick="eliminar(${indexOriginal})">Eliminar</button>`;
                }

                tbody.innerHTML += `
                <tr>
                    <td>${d.codigo || ''}</td>
                    <td><strong>${d.nombre || ''}</strong></td>
                    <td>${d.codActividad || ''}</td>
                    <td>${d.actividad || ''}</td>
                    <td>${d.produccion || ''}</td>
                    <td>${d.lote || ''}</td>
                    <td>${d.hectareas || ''}</td>
                    <td>${d.anio || ''}</td>
                    <td>${d.dia || ''}</td>
                    <td>${d.avance || ''}</td>
                    <td>${d.hEntrada || ''}</td>
                    <td>${d.hSalida || ''}</td>
                    <td>${d.hOrdinarias || ''}</td>
                    <td>${d.hExtras || ''}</td>
                    <td>${acciones}</td>
                </tr>`;
            });

            renderizarPaginacion(datosFiltrados.length, filasPorPagina, paginaActualDiario, 'paginacionDiario', renderizarDiario);
        }

        function limpiar() {

            if (!db.tienePermiso('editarRegistros')) {
                mostrarNotificacion('No tiene permiso para editar registros', 'error');
                return;
            }

            let d = datosDiarios[i];
            const ids = ['codigo', 'nombre', 'codActividad', 'actividad', 'produccion', 'lote', 'hectareas', 'anio', 'dia', 'avance', 'hEntrada', 'hSalida', 'hOrdinarias', 'hExtras'];
            ids.forEach(id => {
                document.getElementById(id).value = d[id] || '';
                if (d[id]) {
                    document.getElementById(id).classList.add('autocompletado');

            });
            document.getElementById("editIndex").value = i;
            abrirFormulario();

            let creador = document.getElementById("grupoCreador").value;

            if (!encCod || !encNom) {
                mostrarNotificacion("Complete todos los datos del encargado", 'error');

            const usuario = db.getUsuarioActual();
            let codigoGenerado = "E Y P " + contadorGrupo.toString().padStart(6, '0') + " " + usuario.username.charAt(0);

            historialGrupos.unshift({
                idGrupo: codigoGenerado,
                fechaCreacion: new Date().toLocaleString(),
                encargado: { codigo: encCod, nombre: encNom },
                registros: [...datosDiarios],
                creador: usuario.username,
                creadorNombre: usuario.nombre
            });

            contadorGrupo++;
            localStorage.setItem("eyp_historial", JSON.stringify(historialGrupos));
            localStorage.setItem("eyp_contador", contadorGrupo);

            datosDiarios = [];
            localStorage.setItem("eyp_diario", JSON.stringify(datosDiarios));

            document.getElementById("encCodigo").value = "";
            document.getElementById("encNombre").value = "";

            cerrarModalGrupo();
            paginaActualDiario = 1;

            let gruposAMostrar = puedeVerTodos ? historialGrupos : historialGrupos.filter(g => g.creador === usuario.username);

            // Aplicar filtros
            const textoBusqueda = document.getElementById('buscarHistorial')?.value.toLowerCase() || '';
            const fechaDesde = document.getElementById('filtroFechaDesde')?.value;
            const fechaHasta = document.getElementById('filtroFechaHasta')?.value;

            gruposAMostrar = gruposAMostrar.filter(g => {
                const cumpleTexto = textoBusqueda === '' ||
                    g.idGrupo.toLowerCase().includes(textoBusqueda) ||
                    g.encargado.nombre.toLowerCase().includes(textoBusqueda) ||
                    g.encargado.codigo.toLowerCase().includes(textoBusqueda) ||
                    (g.creadorNombre || g.creador).toLowerCase().includes(textoBusqueda);

                let cumpleFecha = true;
                if (fechaDesde || fechaHasta) {
                    const fechaGrupo = new Date(g.fechaCreacion);
                    if (fechaDesde) {
                        const desde = new Date(fechaDesde);
                        desde.setHours(0, 0, 0, 0);
                        if (fechaGrupo < desde) cumpleFecha = false;
                    }
                    if (fechaHasta) {
                        const hasta = new Date(fechaHasta);
                        hasta.setHours(23, 59, 59, 999);
                        if (fechaGrupo > hasta) cumpleFecha = false;
                    }
                }
                return cumpleTexto && cumpleFecha;
            });

            // Aplicar paginación
            const inicio = (paginaActualHistorial - 1) * gruposPorPagina;
            const fin = inicio + gruposPorPagina;
            const gruposPaginados = gruposAMostrar.slice(inicio, fin);

            contenedor.innerHTML = gruposPaginados.length === 0 ?
                "<p style='text-align:center; padding:20px; background:var(--gris-fondo); border:1px solid var(--gris-borde);'>No hay grupos guardados que coincidan con los filtros.</p>" : "";

            gruposPaginados.forEach((g, i) => {
                const indexOriginal = historialGrupos.findIndex(h => h.idGrupo === g.idGrupo);

                let acciones = '';
                acciones += `<button class="btn-action btn-view" onclick="verDetalleGrupo(${indexOriginal})">VER</button> `;

                if (db.tienePermiso('editarRegistros') && (g.creador === usuario.username || db.esAdministrador())) {
                    acciones += `<button class="btn-action btn-edit" onclick="editarEncargadoGrupo(${indexOriginal})">ENC</button> `;
                    acciones += `<button class="btn-action btn-edit" onclick="editarRegistrosGrupo(${indexOriginal})" style="background:var(--verde-claro); color:var(--verde-texto); border-color:var(--verde-texto);">REG</button> `;
                }

                if (db.tienePermiso('eliminarRegistros') && (g.creador === usuario.username || db.esAdministrador())) {
                    acciones += `<button class="btn-action btn-delete" onclick="eliminarGrupo(${indexOriginal})">ELIM</button> `;
                }

                if (db.tienePermiso('exportarExcel')) {
                    acciones += `<button class="btn-action btn-export" onclick="descargarGrupoCSV(${indexOriginal})" style="width:auto; padding:5px 10px">EXCEL</button>`;
                }

                contenedor.innerHTML += `
                <div class="group-card">
                    <div class="group-header">
                        <div>
                            <span class="group-code">${g.idGrupo}</span>
                            <span class="group-creador">(Creado por: ${g.creadorNombre || g.creador})</span><br>
                            <small style="color:var(--gris-oscuro);">${g.fechaCreacion} | ${g.registros.length} registros</small>
                        </div>
                        <div style="display:flex; gap:5px; flex-wrap:wrap;">
                            ${acciones}
                        </div>
                    </div>
                    <div style="font-size:12px; color:var(--charcoal); background:var(--gris-fondo); padding:8px; border:1px solid var(--gris-borde);">
                        <strong>Encargado:</strong> ${g.encargado.nombre} (${g.encargado.codigo})
                    </div>
                </div>`;
            });

            renderizarPaginacion(gruposAMostrar.length, gruposPorPagina, paginaActualHistorial, 'paginacionHistorial', renderizarHistorial);
        }

        function eliminarRegistroDeGrupo(button, grupoIndex, regIndex) {
            if (!db.tienePermiso('eliminarRegistros')) {
                mostrarNotificacion('No tiene permiso para eliminar registros', 'error');
                return;
            }

            confirmarAccion("¿Eliminar este registro del grupo?", () => {
                let row = button.closest('tr');
                row.remove();

                let tbody = document.getElementById("editRegistrosBody");
                let rows = tbody.querySelectorAll('tr');
                rows.forEach((row, idx) => {
                    let deleteBtn = row.querySelector('.btn-eliminar-registro');
                    if (deleteBtn) {
                        let oldOnclick = deleteBtn.getAttribute('onclick');
                        let newOnclick = oldOnclick.replace(/,\s*\d+\s*\)/, `, ${idx})`);
                        deleteBtn.setAttribute('onclick', newOnclick);
                    }
                });

                mostrarNotificacion("Registro eliminado", 'exito');

        function guardarEdicionRegistros() {
            if (!db.tienePermiso('editarRegistros')) {
                mostrarNotificacion('No tiene permiso para editar registros', 'error');
                return;
            }

            let grupoIndex = document.getElementById("editRegistrosGrupoIndex").value;
            let tbody = document.getElementById("editRegistrosBody");
            let rows = tbody.querySelectorAll('tr');

            let nuevosRegistros = [];
            let registrosGuardados = 0;
            let registrosConError = 0;

            rows.forEach(row => {
                let registro = {
                    codigo: row.querySelector(".reg-codigo").value,
                    nombre: row.querySelector(".reg-nombre").value,
                    codActividad: row.querySelector(".reg-codActividad").value,
                    actividad: row.querySelector(".reg-actividad").value,
                    produccion: row.querySelector(".reg-produccion").value,
                    lote: row.querySelector(".reg-lote").value,
                    hectareas: row.querySelector(".reg-hectareas").value,
                    anio: row.querySelector(".reg-anio").value,
                    dia: row.querySelector(".reg-dia").value,
                    avance: row.querySelector(".reg-avance").value,
                    hEntrada: row.querySelector(".reg-hEntrada").value,
                    hSalida: row.querySelector(".reg-hSalida").value,
                    hOrdinarias: row.querySelector(".reg-hOrdinarias").value,
                    hExtras: row.querySelector(".reg-hExtras").value
                };

                if (registro.nombre) {
                    nuevosRegistros.push(registro);
                    registrosGuardados++;
                } else {
                    registrosConError++;
                    row.querySelector(".reg-nombre").style.borderColor = 'var(--rojo-texto)';
                }
            });

            if (registrosConError > 0) {
                mostrarNotificacion(`${registrosConError} registro(s) no tienen nombre y no se guardaron`, 'error');
                return;
            }

            historialGrupos[grupoIndex].registros = nuevosRegistros;
            localStorage.setItem("eyp_historial", JSON.stringify(historialGrupos));

            cerrarModalEditarRegistros();
            renderizarHistorial();
            mostrarNotificacion(`${registrosGuardados} registros actualizados correctamente`, 'exito');
            currentEditMode = false;
        }

            let blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);

                <div class="form-group">
                    <label>Nombre de usuario</label>

                </div>
                
                <div class="form-group" style="margin-top:10px;">
                    <label>Nueva contraseña (dejar en blanco para no cambiar)</label>
                    <input type="password" id="edit-password" style="width:100%; padding:8px; border:1px solid var(--gris-borde);">
                </div>

                        <label><input type="checkbox" id="edit-perm-verTodosLosGrupos" ${usuario.permisos.verTodosLosGrupos ? 'checked' : ''}> Ver Todos los Grupos</label>
                        <label><input type="checkbox" id="edit-perm-cambiarPassword" ${usuario.permisos.cambiarPassword ? 'checked' : ''}> Cambiar Contraseña</label>

                </div>
                
                <div style="margin-top:15px;">
                    <h4>Pregunta de seguridad</h4>

                        <label>Pregunta</label>

        // Guardar edición de usuario

                    verTodosLosGrupos: document.getElementById('edit-perm-verTodosLosGrupos').checked,

            if (password) {

        // Eliminar usuario
        window.eliminarUsuarioConfirm = function (id) {

        // Mostrar panel de Admin DB
        window.mostrarPanelAdminDB = function () {
            if (!db.tienePermiso('verAdminDB')) {
                mostrarNotificacion('No tiene permiso para ver esta sección', 'error');
                return;
            }

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';

            const contenido = document.createElement('div');
            contenido.className = 'modal-content';
            contenido.style.maxWidth = '1000px';

            contenido.innerHTML = `
                <h2 style="margin-bottom:20px;">Administración de Base de Datos</h2>
                
                <div style="margin-bottom:30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3>Trabajadores</h3>
                        <button onclick="agregarTrabajadorAdmin()" class="btn-add btn-small">+ Nuevo Trabajador</button>
                    </div>
                    
                    <div style="margin-bottom:15px;">
                        <input type="text" id="buscarTrabajadores" class="search-input" placeholder="Buscar trabajador por código o nombre..." style="width:100%;">
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table class="admin-db-table" id="tablaTrabajadores">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoTrabajadores"></tbody>
                        </table>
                        <div id="paginacionTrabajadores" class="pagination"></div>
                    </div>
                </div>
                
                <div style="margin-top:30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3>Actividades</h3>
                        <button onclick="agregarActividadAdmin()" class="btn-add btn-small">+ Nueva Actividad</button>
                    </div>
                    
                    <div style="margin-bottom:15px;">
                        <input type="text" id="buscarActividades" class="search-input" placeholder="Buscar actividad por código o nombre..." style="width:100%;">
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table class="admin-db-table" id="tablaActividades">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Actividad</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoActividades"></tbody>
                        </table>
                        <div id="paginacionActividades" class="pagination"></div>
                    </div>
                </div>
                
                <button onclick="this.closest('.modal').remove()" class="btn-group" style="width:100%; margin-top:30px;">Cerrar</button>
            `;

            modal.appendChild(contenido);
            document.body.appendChild(modal);

            // Variables de paginación para Admin DB
            window.paginaTrabajadores = 1;
            window.paginaActividades = 1;

            renderizarAdminDB();

            document.getElementById('buscarTrabajadores').addEventListener('input', () => {
                window.paginaTrabajadores = 1;
                renderizarAdminDB();
            });
            document.getElementById('buscarActividades').addEventListener('input', () => {
                window.paginaActividades = 1;
                renderizarAdminDB();
            });
        };

        function renderizarAdminDB() {
            const cuerpoTrabajadores = document.getElementById('cuerpoTrabajadores');
            const cuerpoActividades = document.getElementById('cuerpoActividades');
            const filasPorPagina = 10;

            if (cuerpoTrabajadores) {
                const filtroTrab = document.getElementById('buscarTrabajadores')?.value.toLowerCase() || '';
                let trabajadores = db.getTrabajadores().filter(t =>
                    t.codigo.toLowerCase().includes(filtroTrab) ||
                    t.nombre.toLowerCase().includes(filtroTrab)
                );

                const inicio = (window.paginaTrabajadores - 1) * filasPorPagina;
                const fin = inicio + filasPorPagina;
                const trabajadoresPaginados = trabajadores.slice(inicio, fin);

                cuerpoTrabajadores.innerHTML = trabajadoresPaginados.map(t => `
                    <tr>
                        <td>${t.codigo}</td>
                        <td>${t.nombre}</td>
                    </tr>
                `).join('');

                renderizarPaginacionAdmin(trabajadores.length, filasPorPagina, window.paginaTrabajadores, 'paginacionTrabajadores', (nuevaPagina) => {
                    window.paginaTrabajadores = nuevaPagina;
                    renderizarAdminDB();
                });
            }

            if (cuerpoActividades) {
                const filtroAct = document.getElementById('buscarActividades')?.value.toLowerCase() || '';
                let actividades = db.getActividades().filter(a =>
                    a.codigo.toLowerCase().includes(filtroAct) ||
                    a.nombre.toLowerCase().includes(filtroAct)
                );

                const inicio = (window.paginaActividades - 1) * filasPorPagina;
                const fin = inicio + filasPorPagina;
                const actividadesPaginadas = actividades.slice(inicio, fin);

                cuerpoActividades.innerHTML = actividadesPaginadas.map(a => `
                    <tr>
                        <td>${a.codigo}</td>
                        <td>${a.nombre}</td>
                    </tr>
                `).join('');

                renderizarPaginacionAdmin(actividades.length, filasPorPagina, window.paginaActividades, 'paginacionActividades', (nuevaPagina) => {
                    window.paginaActividades = nuevaPagina;
                    renderizarAdminDB();
                });
            }
        }

        function renderizarPaginacionAdmin(totalItems, itemsPorPagina, paginaActual, elementoId, callback) {
            const totalPaginas = Math.ceil(totalItems / itemsPorPagina);
            const contenedor = document.getElementById(elementoId);
            if (!contenedor) return;

            if (totalPaginas <= 1) {
                contenedor.innerHTML = '';
                return;
            }

            let html = `
                <span class="pagination-info">
                    ${paginaActual} de ${totalPaginas}
                </span>
            `;

            html += `<button onclick="callback(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>‹</button>`;

            let inicio = Math.max(1, paginaActual - 2);
            let fin = Math.min(totalPaginas, paginaActual + 2);

            for (let i = inicio; i <= fin; i++) {
                html += `<button onclick="callback(${i})" class="${i === paginaActual ? 'active' : ''}">${i}</button>`;
            }

            html += `<button onclick="callback(${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled' : ''}>›</button>`;

            contenedor.innerHTML = html;
        }

        // Hacer funciones globales
        window.switchTab = switchTab;
        window.abrirFormulario = abrirFormulario;
        window.guardar = guardar;
        window.limpiar = limpiar;
        window.editar = editar;
        window.eliminar = eliminar;
        window.abrirModalGrupo = abrirModalGrupo;
        window.cerrarModalGrupo = cerrarModalGrupo;

        window.verDetalleGrupo = verDetalleGrupo;

        window.editarEncargadoGrupo = editarEncargadoGrupo;
        window.guardarEdicionEncargado = guardarEdicionEncargado;
        window.editarRegistrosGrupo = editarRegistrosGrupo;

        window.cerrarModalEditarRegistros = cerrarModalEditarRegistros;
        window.eliminarGrupo = eliminarGrupo;

        window.exportarExcel = exportarExcel;

        // Inicializar la aplicación
        renderizarApp();
    </script>
